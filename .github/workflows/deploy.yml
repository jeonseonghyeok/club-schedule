name: Build and Deploy

on:
  push:
    branches: [ master ]
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/club-schedule
  WEB_IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/club-schedule-web
  DEPLOY_DOMAIN: dev.crewhub.store

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            context: ./backend
            image: club-schedule
          - name: web
            context: ./frontend
            image: club-schedule-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (arm64 크로스 빌드용)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image (${{ matrix.name }})
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 배포 정의(compose.yml, api-routes)를 서버의 ~/services/club-schedule/ 로 복사한다.
      # 실제 환경변수(dev.env)는 서버에만 있고 저장소에는 없다.
      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: deploy/compose.yml,deploy/api-routes
          target: services/club-schedule
          strip_components: 1

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ~/services/club-schedule
            # 태그 없이(latest) 실행한다 — 커밋 SHA 태그는 Docker Hub 에 남아 롤백용으로 쓴다.
            export APP_ENV=dev IMAGE=${{ env.IMAGE_NAME }} WEB_IMAGE=${{ env.WEB_IMAGE_NAME }} IMAGE_TAG=
            docker compose pull
            docker compose up -d
            # 기본은 web(React), deploy/api-routes 의 경로만 api 로 보낸다.
            # 경로를 먼저 등록한 뒤 기본 대상을 바꿔 /api 가 잠시라도 web 으로 가지 않게 한다.
            ~/infra/npm/bin/npm-site locations ${{ env.DEPLOY_DOMAIN }} club-schedule-api-dev 8080 \
              $(grep -vE '^[[:space:]]*(#|$)' api-routes)
            ~/infra/npm/bin/npm-site forward ${{ env.DEPLOY_DOMAIN }} club-schedule-web-dev 80
            # 구 방식(docker run, 호스트 포트 publish) 컨테이너 정리
            docker rm -f club-schedule 2>/dev/null || true
            docker image prune -f
