<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="baseHead">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle} ?: '관리자 대시보드'">관리자 대시보드</title>
    <th:block th:replace="fragments :: csrfMeta"></th:block>

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <!-- admin 탭/패널은 일반 페이지의 "chip" 탭과 다른 폴더탭 모양을 쓰므로 로컬에서 재정의 -->
    <style>
        .tabs { display: flex; gap: 8px; border-bottom: 1px solid #e2e8f0; margin-bottom: 12px; flex-wrap: wrap; }
        .tab { padding: 8px 12px; cursor: pointer; background: #f8fafc; border-radius: 6px 6px 0 0; border: 1px solid #e2e8f0; border-bottom: none; font-weight: 400; }
        .tab.active { background: white; color: #0f172a; font-weight: 600; box-shadow: 0 -2px 0 rgba(37,99,235,0.08) inset; }
        .panel { display: none; padding: 16px; border: 1px solid #e2e8f0; background: white; border-radius: 0 6px 6px 6px; }
        .panel.active { display: block; }
    </style>

    <!-- Core scripts: use Thymeleaf for server paths and relative src for static file preview -->
    <script th:src="@{/js/admin.js}" src="../../static/js/admin.js"></script>
    <script th:src="@{/js/admin-renderer.js}" src="../../static/js/admin-renderer.js"></script>
    <script th:src="@{/js/admin-pagination.js}" src="../../static/js/admin-pagination.js"></script>
</head>
</html>
