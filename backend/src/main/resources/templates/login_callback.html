<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>카카오 자동 로그인/회원가입</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>카카오 로그인 상태</h1>
            <div id="token-info">
                <div id="callbackSpinner" class="spinner" aria-hidden="true"></div>
                <p id="callbackMessage" class="muted">로그인 처리 중입니다...</p>
            </div>
        </div>
    </div>

    <script>
    const KAKAO_REST_API_KEY = 'aa4268b0d218c509562ca2ee74f23d94';

    function getQueryParam(name) {
        return new URL(window.location.href).searchParams.get(name);
    }

    function buildRedirectUri() {
        return window.location.origin + window.location.pathname;
    }

    function buildKakaoAuthUrl(redirectUri) {
        const base = 'https://kauth.kakao.com/oauth/authorize?response_type=code';
        return base + '&client_id=' + encodeURIComponent(KAKAO_REST_API_KEY) + '&redirect_uri=' + encodeURIComponent(redirectUri);
    }

    async function postCodeToServer(code, redirectUri, returnTo) {
        const payload = { code: code, redirectUri: redirectUri, returnTo: returnTo };
        const resp = await fetch('/api/login/kakao', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin',
            body: JSON.stringify(payload)
        });
        return resp;
    }

    function redirectToKakaoAuth() {
        const redirectUri = buildRedirectUri();
        window.location.href = buildKakaoAuthUrl(redirectUri);
    }

    function showCallbackError(message) {
        const spinner = document.getElementById('callbackSpinner');
        if (spinner) spinner.style.display = 'none';
        const msgEl = document.getElementById('callbackMessage');
        if (msgEl) msgEl.textContent = message;
    }

    async function processKakaoCallback() {
        const code = getQueryParam('code');
        if (!code) return;

        try {
            const redirectUri = buildRedirectUri();
            const returnToParam = new URL(window.location.href).searchParams.get('returnTo') || '/';
            const response = await postCodeToServer(code, redirectUri, returnToParam);

            if (response.ok) {
                const msgEl = document.getElementById('callbackMessage');
                if (msgEl) msgEl.textContent = '로그인 완료되어 잠시후 메인화면으로 이동됩니다.';
                setTimeout(() => { window.location.href = '/'; }, 1000);
                return;
            }

            let err = { message: '알 수 없는 오류' };
            try { err = await response.json(); } catch (e) { /* 파싱 실패 무시 */ }
            showCallbackError(`로그인 처리 중 오류가 발생했습니다: ${err.message || '알 수 없는 오류'}`);
            console.error('서버 오류:', err);
        } catch (err) {
            showCallbackError('네트워크 오류가 발생했습니다.');
            console.error('네트워크 오류:', err);
        }
    }

    window.onload = async function() {
        const code = getQueryParam('code');
        if (code) {
            await processKakaoCallback();
        } else {
            redirectToKakaoAuth();
        }
    };
    </script>
</body>
</html>
