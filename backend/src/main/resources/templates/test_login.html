<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>테스트 로그인</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <h1>테스트 로그인</h1>
    <p>개발 환경 전용. 운영 서버에서는 동작하지 않습니다.</p>
    <label for="username" class="form-label">테스트 계정 선택</label>
    <select id="username" class="form-control">
      <option value="">-- 계정 선택 --</option>
      <option th:each="u : ${testAccounts}" th:value="${u.kakaoApiId}" th:text="${u.nickname}"></option>
    </select>
    <button onclick="doLogin()" class="btn" style="width:100%;justify-content:center;">로그인</button>
    <div class="form-msg" id="msg"></div>
  </div>
</div>
<script>
async function doLogin(){
  var kakaoApiId=document.getElementById('username').value;
  if(!kakaoApiId){showMsg('계정을 선택해주세요.','error');return;}
  try{
    var r=await fetch('/login/test',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kakaoApiId:Number(kakaoApiId)})});
    var j=await r.json();
    if(r.ok){
      showMsg(j.nickname+'('+j.userKey+') 로그인 완료. 이동 중…','ok');
      setTimeout(()=>location.href='/',600);
    }else{
      showMsg(j.message||'로그인 실패','error');
    }
  }catch(e){showMsg(e.message,'error');}
}
function showMsg(m,type){var el=document.getElementById('msg');el.textContent=m;el.className='form-msg '+type;el.style.display='block';}
</script>
</body>
</html>
