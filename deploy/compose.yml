# club-schedule 배포 정의 (dev / prod 공통)
#
# 서버에서는 ~/services/club-schedule/ 에 이 파일과 <env>.env 를 두고 실행한다(CI 가 복사).
#   APP_ENV=dev docker compose -p club-schedule-dev up -d
#
# - 호스트 포트를 열지 않는다. 외부 노출은 NPM Proxy Host 가 담당한다.
#     /api/**  → club-schedule-api-<env>:8081
#     그 외     → club-schedule-web-<env>:80   (React 로 옮긴 화면부터 순차 전환, docs/DEV_SERVER.md)
# - 이미지 태그는 IMAGE_TAG 로 고정할 수 있다(기본 latest, CI 는 커밋 SHA 를 넘긴다).
name: club-schedule-${APP_ENV:?APP_ENV=dev|prod}

services:
  api:
    image: ${IMAGE:-tony3389/club-schedule}:${IMAGE_TAG:-latest}
    container_name: club-schedule-api-${APP_ENV}
    restart: unless-stopped
    env_file: ./${APP_ENV}.env
    environment:
      TZ: Asia/Seoul
    expose:
      - "8081"
    networks:
      - app-network

  web:
    image: ${WEB_IMAGE:-tony3389/club-schedule-web}:${IMAGE_TAG:-latest}
    container_name: club-schedule-web-${APP_ENV}
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - app-network

networks:
  app-network:
    external: true
