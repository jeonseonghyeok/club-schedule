# 정적 SPA 서빙. /api 는 NPM 이 api 컨테이너로 보내므로 여기까지 오면 잘못 라우팅된 요청이다.
server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;

	gzip on;
	gzip_types text/css application/javascript application/json image/svg+xml;

	location /api/ {
		return 404;
	}

	# 파일명에 해시가 붙은 빌드 산출물은 오래 캐시한다
	location /assets/ {
		expires 1y;
		add_header Cache-Control "public, immutable";
		try_files $uri =404;
	}

	# 클라이언트 라우팅: 없는 경로는 index.html 로. index.html 은 매번 재검증한다.
	location / {
		add_header Cache-Control "no-cache";
		try_files $uri /index.html;
	}
}
