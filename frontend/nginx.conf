# 정적 SPA 서빙. /api 는 NPM 이 api 컨테이너로 보내므로 여기까지 오면 잘못 라우팅된 요청이다.
server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;

	gzip on;
	gzip_types text/css application/javascript application/json image/svg+xml;

	location /api/ {
		return 404;
	}

	# 파일명에 해시가 붙은 빌드 산출물은 오래 캐시한다
	location /assets/ {
		expires 1y;
		add_header Cache-Control "public, immutable";
		try_files $uri =404;
	}

	# 서비스 워커·manifest 는 바뀌면 바로 반영되어야 하므로 캐시하지 않는다
	location = /sw.js {
		add_header Cache-Control "no-cache";
		try_files $uri =404;
	}

	location = /manifest.webmanifest {
		types { }
		default_type application/manifest+json;
		add_header Cache-Control "no-cache";
		try_files $uri =404;
	}

	# 모임 전용 앱(/g/{id}/): 주소로 바로 들어와도 그 모임 앱으로 설치되도록 index.html 의
	# manifest·아이콘 링크를 모임 것으로 바꿔 보낸다(화면에서도 같은 값으로 다시 맞춘다 — useGroupAppHead)
	location ~ ^/g/(?<group_id>[0-9]+)/ {
		add_header Cache-Control "no-cache";
		set $og_query "app=true";
		ssi on;
		ssi_silent_errors on;
		sub_filter_once off;
		sub_filter '/manifest.webmanifest' '/api/groups/$group_id/app-manifest';
		sub_filter '/icons/apple-touch-icon.png' '/api/groups/$group_id/app-icon.png';
		rewrite ^ /index.html break;
	}

	# 모요라 모임 화면(/groups/{id}): 링크 미리보기 태그만 넣는다
	location ~ ^/groups/(?<group_id>[0-9]+)$ {
		add_header Cache-Control "no-cache";
		set $og_query "app=false";
		ssi on;
		ssi_silent_errors on;
		rewrite ^ /index.html break;
	}

	# 링크 미리보기(og) 태그 조각 — 위 두 위치의 SSI 가 부른다(밖에서는 못 부름).
	# API 컨테이너 주소는 환경마다 달라 템플릿 변수로 받는다(compose 의 API_UPSTREAM). 느리거나 실패하면 태그 없이 보낸다.
	location = /__og {
		internal;
		resolver 127.0.0.11 valid=30s ipv6=off;
		proxy_connect_timeout 1s;
		proxy_read_timeout 2s;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-Host $host;
		proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
		proxy_pass http://${API_UPSTREAM}/api/groups/$group_id/og?$og_query;
	}

	# 클라이언트 라우팅: 없는 경로는 index.html 로. index.html 은 매번 재검증한다.
	location / {
		add_header Cache-Control "no-cache";
		try_files $uri /index.html;
	}
}
